name: Android APK de prueba

on:
  push:
    branches:
      - main
      - fase3/android-alpha
      - fase3/respaldos-v3.0.1
      - fase3/redisenio-v3.1
      - fase3/cuaderno-v3.1.1
      - fase3/atlas-hexagonal-v3.2
      - fase3/museo-inventario-v3.3
      - fase4/respaldos-africa-v3.4
      - fase4/restauracion-memoria-africa-v3.5
      - fase4/aceleradores-v3.6
      - fase4/sprites-v3.6.1
      - fase4/africa-misiones-v3.7
      - fase4/africa-expediciones-v3.8
      - fase4/africa-sprites-v3.9
      - fase4/africa-museo-v3.10
      - fase4/ecologia-africa-v3.10.1
      - fase4/museo-cinco-salas-v3.11
      - fase4/africa-fosiles-v3.12
    paths:
      - "www/**"
      - "tests/**"
      - "android-native/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verificar Android SDK del runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Verificar JavaScript del juego
        run: |
          node --check www/js/journal-ui-v3250.js
          node --check www/js/lab/journal-lab-v3250.js
          node --check www/js/app.js
          node --check scripts/benchmark-stability-v3240.cjs
          node --check scripts/check-stability-browser-v3240.cjs
          node --check tests/helpers/legacy-source.cjs
          node --check www/js/mobile-ui.js
          node --check www/sw.js
          node --check www/js/southamerica-data-v3230.js
          node --check www/js/southamerica-art-v3230.js
          node --check www/js/southamerica-polish-v3231.js
          node --check www/js/lab/southamerica-audit-v3231.js
          node --check www/js/southamerica-geography-v3230.js
          node --check www/js/lab/southamerica-lab-v3230.js
          node scripts/build-southamerica-lab-v3230.cjs --check
          node scripts/build-southamerica-audit-v3231.cjs --check
          node --check www/js/northamerica-data-v3220.js
          node --check www/js/northamerica-art-v3220.js
          node --check www/js/northamerica-polish-v3221.js
          node --check www/js/lab/northamerica-lab-v3220.js
          node --check www/js/pwa-update-v3220.js
          node scripts/build-northamerica-lab-v3220.cjs --check
          node --check www/js/pwa-update-v3212.js
          node --check www/js/update-client-v3212.js
          node --check www/js/save-manager.js
          node --check www/js/field-scene-v3210.js
          node --check www/js/field-ui-v3210.js
          node --check www/js/lab/field-lab-v3210.js
          node --check www/js/atlas-geography-v3211b.js
          node --check www/js/lab/geography-lab-v3211b.js
          node --check www/js/atlas-ui-v3211.js
          node --check www/js/atlas-map-v3211.js
          node --check www/js/lab/atlas-lab-v3211.js
          node --test tests/*.test.cjs

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear proyecto nativo Android
        run: npx cap add android

      - name: Copiar juego web a Android
        run: npx cap sync android

      - name: Fijar versión del APK
        run: python3 scripts/configure-android-version.py

      - name: Habilitar exportación e importación nativa de partidas
        run: python3 scripts/install-atlas-export.py

      - name: Fijar orientacion vertical en Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          if 'android:screenOrientation=' not in s:
              assert 'android:name=".MainActivity"' in s, "No se encontro MainActivity"
              s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="portrait"', 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Compilar APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: El-Gran-Atlas-Beta-3.25.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


      - name: Publicar APK beta con enlace directo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version.replace(/-b$/, 'b')")
          TAG="v${VERSION}"
          FILE="El-Gran-Atlas-Beta-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${FILE}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILE}" --clobber
          else
            gh release create "${TAG}" "${FILE}" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "El Gran Atlas · Beta ${VERSION}" \
              --notes "APK de depuración para pruebas de El Gran Atlas. Guarda un respaldo antes de actualizar. No es una versión definitiva."
          fi
