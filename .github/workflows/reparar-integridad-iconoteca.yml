name: Reparación puntual de integridad del Atlas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reparar-integridad-iconoteca.yml'

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Regenerar manifiesto y revisión de caché con el generador oficial
        run: node scripts/build-naturalist-release.cjs --write
      - name: Verificar integridad y pruebas existentes
        run: npm run release:verify
      - name: Confirmar únicamente los dos artefactos de integridad
        run: |
          set -eu
          changes="$(git status --porcelain)"
          echo "$changes"
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(www/atlas-integrity.json|www/sw.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Detectados cambios imprevistos: $unexpected"
            exit 1
          fi
          git add www/atlas-integrity.json www/sw.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate validated Atlas 4.9.6 integrity artifacts"
            git push origin HEAD:main
          fi
