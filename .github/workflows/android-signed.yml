name: Android APK firmado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar secretos de firma
        env:
          KEYSTORE: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for pair in KEYSTORE:ATLAS_ANDROID_KEYSTORE_BASE64 STORE_PASSWORD:ATLAS_ANDROID_STORE_PASSWORD KEY_ALIAS:ATLAS_ANDROID_KEY_ALIAS KEY_PASSWORD:ATLAS_ANDROID_KEY_PASSWORD; do
            variable=${pair%%:*}
            secret_name=${pair#*:}
            if [ -z "${!variable}" ]; then
              echo "::error::Falta el secreto ${secret_name} en Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          exit "$missing"

      - name: Materializar candidato Oceanía validado sin desplegar
        if: github.ref == 'refs/heads/gm02/oceania'
        run: |
          node --test tests/oceania-scientific-v3290.test.cjs tests/oceania-runtime-v3290.test.cjs tests/oceania-art-v3290.test.cjs tests/oceania-release-v3290.test.cjs
          node scripts/build-oceania-release-v3290.cjs --output "$RUNNER_TEMP/atlas-3290" > "$RUNNER_TEMP/atlas-staging-manifest.json"
          cp -a "$RUNNER_TEMP/atlas-3290/www/." www/
          cp "$RUNNER_TEMP/atlas-3290/package.json" package.json
          cp "$RUNNER_TEMP/atlas-3290/capacitor.config.json" capacitor.config.json

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Habilitar exportación e importación nativa de partidas
        run: python3 scripts/install-atlas-export.py

      - name: Configurar versión Android
        run: python3 scripts/configure-android-version.py

      - name: Preparar almacén de firma
        env:
          KEYSTORE: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/atlas-signing/atlas-release.jks"
          chmod 600 "$RUNNER_TEMP/atlas-signing/atlas-release.jks"

      - name: Configurar firma y verticalidad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          if 'android:screenOrientation=' not in s:
              assert 'android:name=".MainActivity"' in s
              s=s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="portrait"', 1)
          manifest.write_text(s)
          app=Path('android/app/build.gradle')
          txt=app.read_text()
          txt+='''
          android {
            signingConfigs {
              atlasStable {
                storeFile file(System.getenv('ATLAS_ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ATLAS_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ATLAS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ATLAS_ANDROID_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.atlasStable
              }
            }
          }
          '''
          app.write_text(txt)
          PY

      - name: Compilar APK release firmado
        env:
          ATLAS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/atlas-signing/atlas-release.jks
          ATLAS_ANDROID_STORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_STORE_PASSWORD }}
          ATLAS_ANDROID_KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
          ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verificar firma, identidad, versión y recursos del APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$AAPT" dump badging "$APK" > apk-badging.txt
          python3 scripts/verify-android-release.py "$APK" apk-badging.txt apk-signature.txt
          sha256sum "$APK" > apk-sha256.txt

      - name: Guardar evidencia de firma y versión
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-verification
          path: |
            apk-signature.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error

      - name: Publicar APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: El-Gran-Atlas-Android-Firmado
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
