
name: Deploy El Gran Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Migration tests compare the real 3.29.0 commit with the new runtime.
          fetch-depth: 0
      - name: Evitar desplegar una rama Oceanía aún sin activar
        if: github.ref == 'refs/heads/gm02/oceania'
        run: |
          node -e "if(require('./package.json').version!=='3.29.0')throw Error('Oceanía aún no está activada en www; completar integración web antes de desplegar')"
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias exactas
        run: npm ci --no-audit --no-fund
      - name: Validar código y pruebas del Atlas
        run: |
          node --check www/js/achievements-v3360.js
          node --check www/js/society-achievements-ui-v3360.js
          node --check www/js/lab/society-lab-v3360.js
          node --check www/js/commissions-v3370.js
          node --check www/js/commissions-ui-v3370.js
          node --check www/js/lab/commissions-lab-v3370.js
          node --check www/js/museum-curation-v3380.js
          node --check www/js/museum-curation-ui-v3380.js
          node --check www/js/lab/museum-curation-lab-v3380.js
          node --check www/js/experience-v3410.js
          node --check www/js/lab/experience-lab-v3410.js
          node --check www/js/app.js
          node --check www/js/polar-data-v3310.js
          node --check www/js/marine-data-v3320.js
          node --check www/js/marine-geography-v3320.js
          node --check www/js/marine-art-v3320.js
          node --check www/js/lab/marine-lab-v3320.js
          node --check www/js/polar-art-v3310.js
          node --check www/js/polar-geography-v3310.js
          node --check www/js/save-manager.js
          node --check www/sw.js
          node --check www/js/deep-data-v3330.js
          node --check www/js/deep-geography-v3330.js
          node --check www/js/deep-art-v3330.js
          node --check www/js/lab/deep-lab-v3330.js
          node --check www/js/abyssal-data-v3340.js
          node --check www/js/abyssal-geography-v3340.js
          node --check www/js/abyssal-art-v3340.js
          node --check www/js/lab/abyssal-lab-v3340.js
          node --check www/js/lab/logistics-lab-v3390.js
          node --check www/js/lab/inventory-lab-v3400.js
          node scripts/build-android-web-release-v3420.cjs
          node scripts/validate-android-v3420.cjs
      - name: Verificar proyecto nativo generado sin compilar ni firmar APK
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android
          python3 scripts/install-atlas-export.py
          python3 scripts/configure-android-version.py
          python3 scripts/configure-android-project.py
          python3 scripts/check-generated-android-v3420.py
      - name: Auditar preparación Android sin generar APK
        run: python3 scripts/audit-android-readiness-v3420.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
