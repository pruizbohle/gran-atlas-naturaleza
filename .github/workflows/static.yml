
name: Deploy El Gran Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Migration tests compare the real 3.29.0 commit with the new runtime.
          fetch-depth: 0
      - name: Evitar desplegar una rama Oceanía aún sin activar
        if: github.ref == 'refs/heads/gm02/oceania'
        run: |
          node -e "if(require('./package.json').version!=='3.29.0')throw Error('Oceanía aún no está activada en www; completar integración web antes de desplegar')"
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código y pruebas del Atlas
        run: |
          node --check www/js/app.js
          node --check www/js/polar-data-v3310.js
          node --check www/js/polar-art-v3310.js
          node --check www/js/polar-geography-v3310.js
          node --check www/js/save-manager.js
          node --check www/sw.js
          node scripts/build-polar-release-v3310.cjs
          node scripts/validate-polar-v3310.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
