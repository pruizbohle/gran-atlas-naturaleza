<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Láminas polares · 3.31.0</title><style>body{margin:16px;background:#edf1ed;color:#243c42;font:16px Georgia}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}article{background:#faf6e8;padding:12px;border:1px solid #8ea3a4;border-radius:12px}svg{width:160px;height:160px;max-width:65%}.mini svg{width:64px;height:64px}.plate{display:flex;align-items:center}p{line-height:1.5}h1{font-size:24px}</style></head><body><h1>Cuaderno de láminas · Ártico y Antártida</h1><p>21 identidades nuevas. Comparación de lámina y escala de 64 px. Sin variantes de pigmentación ni sexos nuevos configurados: se conserva el perfil normal. El zorro ártico mantiene su ilustración histórica en el juego.</p><div id="plates" class="grid"></div><script src="js/polar-data-v3310.js"></script><script src="js/polar-art-v3310.js"></script><script>document.getElementById('plates').innerHTML=Object.values(AtlasPolar3310.species).map(s=>'<article><h2>'+s.name+'</h2><i>'+s.latin+'</i><div class="plate">'+AtlasPolarArt3310.render(s)+'<span class="mini">'+AtlasPolarArt3310.render(s)+'</span></div><p>'+s.family+' · '+s.rare+'</p></article>').join('');</script></body></html>
