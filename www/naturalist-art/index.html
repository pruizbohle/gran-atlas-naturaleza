<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio de ilustración científica V4.9.6 · El Gran Atlas</title>
  <link rel="stylesheet" href="../css/naturalist-art-v400.css">
  <link rel="stylesheet" href="../css/field-v3210.css">
  <link rel="stylesheet" href="lab.css">
  <script src="catalog.js" defer></script>
  <script src="art01.js" defer></script>
  <script src="art02.js" defer></script>
  <script src="art03.js" defer></script>
  <script src="art04.js" defer></script>
  <script src="art05.js" defer></script>
  <script src="art06.js" defer></script>
  <script src="pigment-audit-data.js" defer></script>
  <script src="../js/naturalist-assets-v400.js" defer></script>
  <script src="../js/naturalist-art-v400.js" defer></script>
  <script src="../js/field-ui-v3210.js" defer></script>
  <script src="pigment-audit.js" defer></script>
  <script src="lab.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="container">
      <p class="eyebrow">El Gran Atlas</p>
      <h1>Laboratorio de ilustración científica</h1>
      <p id="migration-progress" class="migration-progress"></p>
      <a class="game-link" href="../index.html">Abrir el juego</a>
    </div>
  </header>
  <main class="container">
    <nav aria-label="Modos del laboratorio" id="modes">
      <button type="button" data-mode="field">Campo</button>
      <button type="button" data-mode="mixed">Campo mixto</button>
      <button type="button" data-mode="journal">Cuaderno</button>
      <button type="button" data-mode="bestiary">Bestiario</button>
      <button type="button" data-mode="museum">Museo</button>
      <button type="button" data-mode="variants">Variantes</button>
      <button type="button" data-mode="pigment-audit">Visor de albinos y melánicos</button>
      <button type="button" data-mode="art01">Variantes revisadas en ART-01</button>
      <button type="button" data-mode="art02">Variantes revisadas en ART-02</button>
      <button type="button" data-mode="art03">Variantes revisadas en ART-03</button>
      <button type="button" data-mode="art04">Variantes corregidas en ART-04</button>
      <button type="button" data-mode="art05">Variantes corregidas en ART-05</button>
      <button type="button" data-mode="art06">Variantes corregidas en ART-06</button>
      <button type="button" data-mode="frames">Ejemplares especiales</button>
      <button type="button" data-mode="gallery">Galería</button>
      <button type="button" data-mode="compare">Comparar estilos</button>
      <button type="button" data-mode="birds">Comparar aves</button>
      <button type="button" data-mode="reptiles">Comparar reptiles</button>
      <button type="button" data-mode="amphibians">Comparar anfibios</button>
      <button type="button" data-mode="cartilaginous">Comparar tiburones y rayas</button>
      <button type="button" data-mode="salmonids">Comparar salmónidos</button>
      <button type="button" data-mode="freshwater">Comparar peces de agua dulce</button>
      <button type="button" data-mode="reef">Comparar peces de arrecife</button>
      <button type="button" data-mode="deep">Comparar peces de aguas profundas</button>
      <button type="button" data-mode="marine">Comparar peces marinos</button>
      <button type="button" data-mode="cephalopods">Comparar cefalópodos</button>
      <button type="button" data-mode="legendary">Colección de legendarios</button>
      <button type="button" data-mode="compression">Compresión</button>
      <button type="button" data-mode="scale">Escala real</button>
      <button type="button" data-mode="visual-scale">Ajustes de escala</button>
      <button type="button" data-mode="review">Revisión artística</button>
    </nav>
    <section aria-labelledby="heading" class="workspace">
      <div class="toolbar">
        <div><h2 id="heading"></h2><p id="summary" aria-live="polite"></p></div>
        <label data-catalog-filter>Grupo <select id="group"><option value="">Todos</option></select></label>
        <label id="order-control" data-catalog-filter>Orden zoológico <select id="bird-order"></select></label>
        <label data-catalog-filter>Familia zoológica <select id="family"></select></label>
        <label data-catalog-filter>Edición <select id="release-scope">
          <option value="">Todas</option>
          <option value="4.9.6">Ilustradas en V4.9.6</option>
          <option value="4.9.5">Ilustradas en V4.9.5</option>
          <option value="4.9.3">Ilustradas en V4.9.3</option>
          <option value="4.9.2">Ilustradas en V4.9.2</option>
          <option value="4.9.1">Ilustradas en V4.9.1</option>
          <option value="4.9.0">Ilustradas en V4.9.0</option>
          <option value="4.8.2">Ilustradas en V4.8.2</option>
          <option value="4.8.1">Ilustradas en V4.8.1</option>
          <option value="4.8.0">Ilustradas en V4.8.0</option>
          <option value="4.7.4">Ilustradas en V4.7.4</option>
          <option value="4.7.3">Ilustradas en V4.7.3</option>
          <option value="catalog">Cambios del catálogo</option>
          <option value="new">Altas del catálogo</option>
        </select></label>
        <label data-catalog-filter>Estado de la lámina
          <select id="cut-state">
            <option value="">Todos</option>
            <option value="ready">Recortado</option>
            <option value="review">Borde por revisar</option>
            <option value="pending">Sin recorte</option>
            <option value="classical">Ilustración científica clásica</option>
            <option value="previous">Ilustración científica pendiente</option>
          </select>
        </label>
        <label id="search-control" data-catalog-filter>Buscar especie <input id="search" type="search" placeholder="Nombre común o científico"></label>
        <label id="species-control" hidden>Especie <select id="species"></select></label>
        <label id="scale-plate-control" hidden>Lámina <select id="scale-plate"></select></label>
        <label id="frame-style-control">Presentación
          <select id="frame-style">
            <option value="bare">Sin marco · halos de categoría</option>
            <option value="outline">Contorno minimalista</option>
            <option value="classic">Comparar con el marco clásico</option>
          </select>
        </label>
        <label id="mixed-control" hidden>Compañero SVG histórico <select id="mixed-svg"></select></label>
        <label id="category-control" hidden>Ejemplar <select id="category"></select></label>
        <label id="context-control" hidden>Vista de juego <select id="context">
          <option>Campo</option><option>Bestiario</option><option>Cuaderno</option><option>Museo</option>
        </select></label>
        <label id="backdrop-control" hidden>Fondo de revisión <select id="backdrop">
          <option value="light">Claro</option>
          <option value="dark">Oscuro</option>
          <option value="grid">Cuadrícula</option>
        </select></label>
        <label id="bird-set-control" hidden>Conjunto anatómico <select id="bird-set"></select></label>
        <label id="variant-view-control" hidden>Comparación de variantes <select id="variant-view">
          <option value="all">Todas las láminas</option>
          <option value="sex">Macho y hembra</option>
        </select></label>
        <label id="comparison-halo-control" hidden>Halo de revisión <select id="comparison-halo"></select></label>
        <label id="comparison-size-control" hidden>Tamaño de lámina <select id="comparison-size">
          <option value="64">64 px</option>
          <option value="128">128 px</option>
          <option value="256" selected>256 px</option>
          <option value="512">512 px</option>
        </select></label>
        <label id="compression-control" hidden>Calidad WebP <select id="compression-quality">
          <option>75</option><option>80</option><option>85</option><option selected>90</option><option>95</option>
        </select></label>
        <label id="comparison-control" hidden>Referencia <select id="comparison-source">
          <option value="styles">Serie 3, Serie 4.3 y científica clásica</option><option value="original">Recorte de Serie 4 anterior</option>
        </select></label>
        <button id="export" type="button" hidden>Exportar JSON</button>
        <button id="review-offline" type="button" hidden></button>
        <a id="review-prepare-offline" href="../actualizar-atlas.html" hidden>Preparar el juego sin conexión</a>
      </div>
      <div id="pigment-audit-filters" class="pigment-audit-filters" role="group" aria-label="Filtros del visor" hidden>
        <label>Buscar especie <input id="audit-search" type="search" placeholder="Nombre o ID"></label>
        <label>Variante <select id="audit-kind">
          <option value="">Todas</option><option value="albino">Albina</option><option value="melanico">Melánica</option>
        </select></label>
        <label>Estado artístico <select id="audit-state">
          <option value="">Todos</option>
          <option value="correcta">Correcta</option><option value="mejorable">Mejorable</option>
          <option value="insuficiente">Insuficiente</option><option value="pendiente">Pendiente</option>
        </select></label>
        <label>Familia zoológica <select id="audit-family"><option value="">Todas</option></select></label>
        <label>Corrección <select id="audit-corrected">
          <option value="">Todas</option><option value="with">Corregidas</option><option value="without">Sin corrección</option>
        </select></label>
        <label>Comparativa <select id="audit-comparison">
          <option value="">Todas</option><option value="with">Con comparativa</option><option value="without">Sin comparativa</option>
        </select></label>
        <label>Ordenar por <select id="audit-sort">
          <option value="family">Familia</option><option value="name">Nombre</option>
          <option value="state">Estado</option><option value="priority">Prioridad</option>
        </select></label>
        <label>Fondo <select id="audit-backdrop"><option value="light">Claro</option><option value="dark">Oscuro</option></select></label>
        <button id="audit-reset" type="button">Restablecer filtros</button>
      </div>
      <div id="content" data-frame-style="bare"></div>
      <dialog id="pigment-audit-detail" aria-labelledby="audit-detail-title">
        <div class="audit-detail-toolbar">
          <h3 id="audit-detail-title"></h3>
          <form method="dialog"><button type="submit" autofocus>Cerrar ficha</button></form>
        </div>
        <div class="audit-detail-toolbar">
          <label>Resolución <select id="audit-detail-size">
            <option value="64">64 px</option><option value="128">128 px</option>
            <option value="256" selected>256 px</option><option value="512">512 px</option>
          </select></label>
          <label>Fondo <select id="audit-detail-backdrop">
            <option value="light">Claro</option><option value="dark">Oscuro</option>
          </select></label>
        </div>
        <div id="audit-detail-content"></div>
      </dialog>
      <p id="status" role="status"></p>
    </section>
  </main>
</body>
</html>
