<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#294337">
<title>Laboratorio de anfibios y reptiles · El Gran Atlas 3.19.2</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;background:#eae1cd;color:#283b32}
*{box-sizing:border-box}body{margin:0 auto;padding:18px;max-width:1150px}
h1,h2{font-family:Georgia,serif}h1{font-size:clamp(23px,4vw,34px);margin:0}
small,.hint{color:#617267}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
a,button{border:1px solid #365640;border-radius:9px;padding:9px 12px;text-decoration:none;font:inherit;background:#294938;color:white;cursor:pointer}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.status{font-weight:700;margin:8px 0 20px}
.group{margin:22px 0 10px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:#f9f1df;border:1px solid #d2c19c;border-radius:14px;padding:9px;min-width:0}
.figure{height:125px;background:#e9dec6;border-radius:9px;display:grid;place-items:center}
.figure svg{height:113px;width:113px}.card h3{margin:9px 0 1px;font:700 15px/1.2 Georgia,serif}
.card p{margin:0;color:#677368;font-size:12px}.family{font:600 11px system-ui;color:#627b66}
.silhouette .figure svg [fill]:not([fill="none"]){fill:#263139!important}
.silhouette .figure svg [stroke]:not([stroke="none"]){stroke:#263139!important}
.silhouette .figure svg circle{visibility:hidden}
@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.figure{height:105px}.figure svg{width:90px;height:90px}}
</style>
</head><body><header class="top"><div><h1>Herpetario ilustrado</h1><small>El Gran Atlas · 3.19.2 · Anfibios y reptiles</small></div><a href="./">Volver al juego</a></header>
<p>Control visual de siluetas, proporciones, colores y rasgos distintivos. La clasificación aquí es artística: no modifica los datos científicos ni el progreso guardado.</p>
<div class="controls"><button id="toggle">Mostrar siluetas negras</button><button id="size">Ampliar dibujos</button></div>
<div class="status" id="status">Cargando ilustraciones…</div><main id="gallery"></main>
<noscript>Activa JavaScript para ver las ilustraciones.</noscript>
<script src="js/herp-art-v3192.js?v=3.19.2"></script>
<script>
(function(){
 const groups=[
 ['Anfibios',[
  ['Rana bermeja','Rana temporaria','reptile','#8b9875'],
  ['Rana goliat','Conraua goliath','salamander','#7a855d'],
  ['Rana de uñas africana','Xenopus laevis','salamander','#778b88'],
  ['Sapo corredor','Epidalea calamita','reptile','#a49c7a'],
  ['Rana de lluvia del desierto','Breviceps macrops','salamander','#c0a881'],
  ['Salamandra común','Salamandra salamandra','salamander','#424b3b'],
  ['Salamandra gigante china','Andrias davidianus','salamander','#796d55'],
  ['Tritón crestado','Triturus cristatus','salamander','#6e7e61']
 ]],
 ['Tortugas y cocodrilos',[
  ['Tortuga mediterránea','Testudo hermanni','tortoise','#95875c'],
  ['Tortuga radiada','Astrochelys radiata','tortoise','#a2945b'],
  ['Tortuga laúd','Dermochelys coriacea','tortoise','#65788c'],
  ['Galápago caspio','Mauremys caspica','tortoise','#697f69'],
  ['Cocodrilo del Nilo','Crocodylus niloticus','crocodile','#63795d'],
  ['Cocodrilo de hocico estrecho','Mecistops cataphractus','crocodile','#6b7158']
 ]],
 ['Serpientes',[
  ['Cobra india','Naja naja','snake','#7a7964'],
  ['Víbora cornuda','Cerastes cerastes','snake','#c3a474'],
  ['Pitón reticulada','Malayopython reticulatus','reptile','#866f52'],
  ['Mamba negra','Dendroaspis polylepis','snake','#546766'],
  ['Krait común','Bungarus caeruleus','snake','#64727b'],
  ['Culebra de collar','Natrix natrix','snake','#6a8668'],
  ['Lución europeo','Anguis fragilis','reptile','#8c8066']
 ]],
 ['Lagartos y gecos',[
  ['Camaleón pantera','Furcifer pardalis','lizard','#51969c'],
  ['Camaleón de Jackson','Trioceros jacksonii','lizard','#6b9e76'],
  ['Gecko tokay','Gekko gecko','lizard','#5b9eaa'],
  ['Geco cola de hoja satánico','Uroplatus phantasticus','lizard','#816b55'],
  ['Geco diurno gigante','Phelsuma grandis','lizard','#40a26b'],
  ['Dragón volador común','Draco volans','reptile','#8ca785'],
  ['Varano de Bengala','Varanus bengalensis','lizard','#6b805b'],
  ['Dragón de Komodo','Varanus komodoensis','reptile','#7e7762'],
  ['Lagarto egipcio de cola espinosa','Uromastyx aegyptia','lizard','#a98b64'],
  ['Lagarto ocelado','Timon lepidus','reptile','#4f9878']
 ]]
 ];
 const out=document.getElementById('gallery'),status=document.getElementById('status'),fn=window.ATLAS_HERP_ART_V3192;
 if(typeof fn!=='function'){status.textContent='Error: no cargó js/herp-art-v3192.js';status.style.color='#a32d2d';return;}
 let count=0;
 for(const [title,items] of groups){
  const h=document.createElement('h2');h.className='group';h.textContent=title;out.append(h);
  const grid=document.createElement('section');grid.className='grid';out.append(grid);
  for(const [name,latin,kind,color] of items){
   const markup=fn({name,latin,kind,color},color,'normal');
   const family=(markup&&markup.match(/data-herp-family="([^"]+)"/)||[])[1]||'sin clasificar';
   if(markup)count++;
   const card=document.createElement('article');card.className='card';
   const image=document.createElement('div');image.className='figure';image.innerHTML=markup||'Sin sprite';
   const label=document.createElement('h3');label.textContent=name;
   const subtitle=document.createElement('p');subtitle.textContent=latin;
   const tax=document.createElement('div');tax.className='family';tax.textContent=family;
   card.append(image,label,subtitle,tax);grid.append(card);
  }
 }
 status.textContent=count+' de 31 ilustraciones cargadas. Versión de galería 3.19.2';
 document.getElementById('toggle').onclick=function(){document.body.classList.toggle('silhouette');this.textContent=document.body.classList.contains('silhouette')?'Restaurar colores':'Mostrar siluetas negras';};
 let big=false;document.getElementById('size').onclick=function(){big=!big;document.querySelectorAll('.figure').forEach(x=>x.style.height=big?'190px':'');document.querySelectorAll('.figure svg').forEach(x=>{x.style.height=big?'180px':'';x.style.width=big?'180px':'';});this.textContent=big?'Reducir dibujos':'Ampliar dibujos';};
})();
</script>
</body></html>
