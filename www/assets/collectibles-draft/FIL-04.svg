<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="Castor canadiense · FIL-04"><title>Castor canadiense · FIL-04</title><desc>Sello antiguo con fauna del país Reconstrucción ilustrativa simplificada. Motivos y proporciones no certifican una réplica auténtica, una emisión exacta ni una procedencia. El catálogo propuesto incluye referencias conocidas después de 1842; esta lámina no afirma su disponibilidad histórica en el juego. Arte propuesto. Sin obtención, prestigio, compras ni recompensas activas.</desc><g stroke-linejoin="round" stroke-linecap="round"><rect x="18" y="12" width="65" height="77" rx="0" fill="#f0dfb8" stroke="#604a35" stroke-width="2"/><rect x="24" y="18" width="53" height="65" rx="0" fill="#a66f53" stroke="#604a35" stroke-width="2"/><path d="M29 61Q26 43 47 43L65 49 71 61 55 68 35 68Z" fill="#dfc9a1" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 61Q13 57 14 67L30 72Z" fill="#b69d73" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="63" cy="49" rx="6" ry="7" fill="#d4be91" stroke="#604a35" stroke-width="2"/><path d="M27 75h43M29 39l14-8 18 7" fill="none" stroke="#dbc59d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="31" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#eadcba">3</text></g></svg>
