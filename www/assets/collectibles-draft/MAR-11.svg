<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="Prisma de las mareas · MAR-11"><title>Prisma de las mareas · MAR-11</title><desc>Cristal fantástico capaz de reflejar corrientes según la leyenda del juego FICCIÓN MITOLÓGICA. Objeto inventado para la leyenda de Atlántida; no es un hallazgo arqueológico ni un mineral certificado. Arte propuesto. Sin obtención, prestigio, compras ni recompensas activas.</desc><g stroke-linejoin="round" stroke-linecap="round"><path d="M22 83L31 66 69 66 80 83Z" fill="#9b714c" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="50" cy="79" rx="24" ry="7" fill="#bc9464" stroke="#604a35" stroke-width="2"/><path d="M31 23L49 38 71 26V65L50 79 31 65Z" fill="#4f9a9a" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 23L40 29V71L50 79 31 65Z" fill="#9bc5bb" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 23L37 13 55 11 71 22 67 32 49 38Z" fill="#c2d8c7" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 38L50 79M67 32V69M37 13L40 29 49 38M40 29L55 11" fill="none" stroke="#397374" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 61L39 68 40 78 29 72ZM71 61L61 68 60 78 71 72Z" fill="#bc8b55" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
