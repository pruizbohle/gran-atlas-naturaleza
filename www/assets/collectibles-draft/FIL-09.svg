<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="Penny Black · FIL-09"><title>Penny Black · FIL-09</title><desc>Primer sello postal adhesivo de uso general Reconstrucción ilustrativa simplificada. Motivos y proporciones no certifican una réplica auténtica, una emisión exacta ni una procedencia. El catálogo propuesto incluye referencias conocidas después de 1842; esta lámina no afirma su disponibilidad histórica en el juego. Arte propuesto. Sin obtención, prestigio, compras ni recompensas activas.</desc><g stroke-linejoin="round" stroke-linecap="round"><rect x="18" y="12" width="65" height="77" rx="0" fill="#f0dfb8" stroke="#604a35" stroke-width="2"/><rect x="24" y="18" width="53" height="65" rx="0" fill="#485249" stroke="#604a35" stroke-width="2"/><path d="M37 71L40 61 35 56 35 48 29 46 35 40Q34 25 49 25Q67 27 63 44L59 55 59 64 69 72Z" fill="#d7c59d" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="60" cy="36" rx="6" ry="7" fill="#baa77a" stroke="#604a35" stroke-width="2"/><path d="M38 34l15-3m-14 14h3M41 58h9" fill="none" stroke="#896f47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 23l8 5m31-5 7 5M29 31v34m44-34v34" fill="none" stroke="#9ba78e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(64 58)"><path d="M13.00 0.00L3.54 3.54L0.00 13.00L-3.54 3.54L-13.00 0.00L-3.54 -3.54L-0.00 -13.00L3.54 -3.54Z" fill="#9d6754" stroke="#604a35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="6" fill="#eee0bf">ONE PENNY</text></g></svg>
