<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="Cinco centavos Franklin · FIL-03"><title>Cinco centavos Franklin · FIL-03</title><desc>Sello de primera emisión nacional Reconstrucción ilustrativa simplificada. Motivos y proporciones no certifican una réplica auténtica, una emisión exacta ni una procedencia. El catálogo propuesto incluye referencias conocidas después de 1842; esta lámina no afirma su disponibilidad histórica en el juego. Arte propuesto. Sin obtención, prestigio, compras ni recompensas activas.</desc><g stroke-linejoin="round" stroke-linecap="round"><rect x="18" y="12" width="65" height="77" rx="0" fill="#f0dfb8" stroke="#604a35" stroke-width="2"/><rect x="24" y="18" width="53" height="65" rx="0" fill="#a28768" stroke="#604a35" stroke-width="2"/><path d="M29 72L39 61 35 49Q30 30 43 25Q60 16 67 36L64 57 58 63 71 73Z" fill="#cbb68f" stroke="#604a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="50" cy="44" rx="13" ry="19" fill="#e0ceb0" stroke="#604a35" stroke-width="2"/><path d="M37 39Q30 45 37 61M64 40Q72 47 64 63M44 53h12M50 43l-3 7h5" fill="none" stroke="#8d7c5d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="44" cy="42" rx="4" ry="4" fill="none" stroke="#604a35" stroke-width="1"/><ellipse cx="56" cy="42" rx="4" ry="4" fill="none" stroke="#604a35" stroke-width="1"/><path d="M48 42h4" fill="none" stroke="#6b6852" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#ece0bf">5 CENTS</text></g></svg>
