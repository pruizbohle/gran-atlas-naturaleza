const $=id=>document.getElementById(id);let tab='atlas';
const TABS=[...new Map(DATA.antes.map(r=>[r.tab,r.tabName])).entries()];
function resList(){const s=$('save').value;return [...new Set(DATA.despues.filter(r=>r.save===s).map(r=>r.res))];}
function fillRes(){const keep=$('res').value||'390×844';$('res').innerHTML=resList().map(r=>'<option'+(r===keep?' selected':'')+'>'+r+'</option>').join('');}
function tabsNav(){$('tabs').innerHTML=TABS.map(([t,n])=>'<button type="button" data-t="'+t+'" aria-pressed="'+(t===tab)+'">'+n+'</button>').join('');}
const row=(lab,a,b,low)=>{const d=(b??0)-(a??0);const cls=d===0||a==null||low===null?'':(low?d<0:d>0)?'better':'worse';return '<dt>'+lab+'</dt><dd class="'+cls+'">'+(a??'—')+' → '+(b??'—')+'</dd>';};
function show(){const s=$('save').value,r=$('res').value;const f=(set)=>DATA[set].find(x=>x.save===s&&x.res===r&&x.tab===tab);const a=f('antes'),b=f('despues');
 const fig=(set,x)=>x?'<figure><img loading="lazy" src="capturas/'+set+'/'+x.shot+'" alt="'+x.tabName+' '+set+' '+x.res+'"><figcaption><b>'+(set==='antes'?'Antes · MEC-09B':'Después · MEC-09C')+'</b></figcaption></figure>':'<figure><figcaption>Sin captura</figcaption></figure>';
 const m=a&&b&&!tab.startsWith('pop')?'<figure><figcaption><b>Medidas</b><dl>'+row('Marco fijo',a.fixed,b.fixed,true)+row('Espacio central',a.panel,b.panel,false)+row('Subpestañas (alto)',a.subtabs,b.subtabs,true)+row('Acciones visibles',a.actionsVisible,b.actionsVisible,false)+row('Controles < 40 px',a.smallTargets,b.smallTargets,true)+row('Texto en pantalla (car.)',a.visibleTextChars,b.visibleTextChars,null)+row('Desbordamiento horizontal',a.overflowX,b.overflowX,true)+row('Cambio de pestaña (ms)',a.switchMs,b.switchMs,null)+'</dl></figcaption></figure>':'';
 $('out').innerHTML=fig('antes',a)+fig('despues',b)+m;}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;tabsNav();show();});
